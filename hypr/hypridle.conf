# ~/.config/hypr/hypridle.conf
#
# This configuration uses hypridle to reliably lock the screen with
# hyprlock before the system suspends on lid close. It prevents the
# system from sleeping until the lockscreen is fully active.

general {
    # How long to wait before activating the lock command after the system is idle.
    lock_after_timeout = 1800      # 30 minutes

    # How long to wait before turning off the screen after the system is idle.
    turn_off_after_timeout = 300  # 5 minutes

    # How long to wait before suspending the system after it's idle.
    suspend_after_timeout = 3600  # 1 hour

    # Command to run when locking.
    # 'pidof hyprlock ||' ensures only one instance of hyprlock is running.
    lock_cmd = pidof hyprlock || hyprlock

    # Command to run before sleeping (e.g., on lid close).
    # This also uses 'loginctl' to ensure the session is marked as locked.
    before_sleep_cmd = loginctl lock-session

    # Command to run after waking up.
    # This ensures the display is turned back on.
    after_sleep_cmd = hyprctl dispatch dpms on

    # If true, hypridle will not lock the screen if an external monitor is connected.
    ignore_dbus_inhibit = false
}

# Listener for system suspend event (e.g., closing the laptop lid).
# This is the key part for your use case.
listener {
    # Event to listen for.
    timeout = 1

    # Action to take on suspend.
    # It runs the 'lock_cmd' and waits for it to finish before allowing suspend.
    on-suspend = pidof hyprlock || hyprlock

    # Action to take upon resuming from suspend.
    # Turns the display on and can also be used to unlock if desired.
    on-resume = hyprctl dispatch dpms on
}

# Example listener for idle timeout (optional but good practice).
listener {
    # Time in seconds before this listener triggers.
    timeout = 1800  # 30 minutes of inactivity

    # Command to run when the timeout is reached.
    on-timeout = pidof hyprlock || hyprlock

    # Command to run when activity is detected after a timeout.
    on-resume = hyprctl dispatch dpms on
}

